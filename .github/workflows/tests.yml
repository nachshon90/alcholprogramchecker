name: Tests

# Runs the full suite on every push and pull request, so a reviewer can see
# at a glance whether the checker still works without installing anything.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest version we support, and the current one.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Tesseract is a separate program, not a Python package. Without it the
      # OCR tests skip themselves, so the run would be green but meaningless.
      - name: Install the Tesseract OCR engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng

      - name: Show versions
        run: |
          tesseract --version
          python --version

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fail loudly rather than silently skipping the integration tests.
      - name: Confirm OCR is really available
        run: |
          python -c "
          import sys
          from labelcheck.ocr import ensure_available
          print('Tesseract', ensure_available())
          "

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      # Proves the sample generator still works, without overwriting the
      # committed fixtures the tests above ran against.
      - name: Check the sample generator runs
        run: |
          cp -r samples "${RUNNER_TEMP}/samples-check"
          cd "${RUNNER_TEMP}/samples-check" && python make_samples.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t label-checker:ci .

      # The image must not start an unprotected public service, so a run with
      # no password is expected to fail. If it succeeds, that is the bug.
      - name: Refuses to start without a password
        run: |
          if docker run --rm label-checker:ci; then
            echo "FAIL: the image started with no password set"
            exit 1
          fi
          echo "OK: refused to start without a password"

      - name: Starts, serves, and demands the password
        env:
          PW: ci-test-password-1234
        run: |
          docker run -d --name checker -p 8080:8080 \
            -e LABELCHECK_PASSWORD="$PW" label-checker:ci

          echo "Waiting for the health check..."
          for _ in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/healthz || {
            echo "FAIL: never became healthy"; docker logs checker; exit 1; }

          anonymous=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          [ "$anonymous" = "401" ] || {
            echo "FAIL: anonymous request returned $anonymous, expected 401"
            docker logs checker; exit 1; }
          echo "OK: anonymous request refused"

          authorised=$(curl -s -o /dev/null -u "x:$PW" \
            -w '%{http_code}' http://127.0.0.1:8080/)
          [ "$authorised" = "200" ] || {
            echo "FAIL: authorised request returned $authorised, expected 200"
            docker logs checker; exit 1; }
          echo "OK: authorised request served"

          # Prove OCR really works inside the image, not just that it boots.
          verdict=$(curl -s -u "x:$PW" -X POST http://127.0.0.1:8080/check \
            -F "brand_name=Old Bridge" \
            -F "class_type=Kentucky Straight Bourbon Whiskey" \
            -F "alcohol_content=45% ABV" -F "net_contents=750 mL" \
            -F "bottler_name=Old Bridge Distillery" \
            -F "bottler_address=Frankfort, Kentucky" \
            -F "label_width_mm=95" \
            -F "label_image=@samples/labels/01_bourbon_compliant.png")
          echo "$verdict" | grep -q "PASS - everything matches" || {
            echo "FAIL: a known-good label did not pass inside the container"
            docker logs checker; exit 1; }
          echo "OK: a known-good label passed inside the container"

      - name: Container logs
        if: always()
        run: docker logs checker || true

      - name: Stop the container
        if: always()
        run: docker rm -f checker || true
